<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Hard Brutalist Offset Shadow -->
  <rect x="8" y="8" width="104" height="104" fill="#121212" />
  
  <!-- Main Badge Box -->
  <rect x="4" y="4" width="104" height="104" fill="#FFE600" stroke="#121212" stroke-width="4" />
  
  <!-- Kinetic Accent Grid Corner -->
  <rect x="4" y="4" width="18" height="18" fill="#121212" />
  <rect x="90" y="90" width="18" height="18" fill="#FF5C00" stroke="#121212" stroke-width="2" />

  <!-- Monogram K - Vertical Stem -->
  <rect x="24" y="24" width="18" height="64" fill="#121212" />

  <!-- Top Diagonal Wing (Cyan Stage Beam) -->
  <polygon points="42,52 68,24 88,24 58,56" fill="#38BDF8" stroke="#121212" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Bottom Diagonal Wing (Lime Sound Wave) -->
  <polygon points="50,52 86,88 66,88 38,60" fill="#A3E635" stroke="#121212" stroke-width="3" stroke-linejoin="round" />

  <!-- Center Energy Flash Bolt (Orange Kinetic Spark) -->
  <polygon points="48,44 60,32 54,46 66,46 44,72 50,54 40,54" fill="#FF5C00" stroke="#121212" stroke-width="2.5" stroke-linejoin="round" />
</svg>
